name: build-ruyi-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Install SDK packages
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch ARSCLib jar
        run: |
          mkdir -p app/libs
          curl -sL -o app/libs/ARSCLib-1.4.0.jar https://github.com/REAndroid/ARSCLib/releases/download/V1.4.0/ARSCLib-1.4.0.jar
          ls -lh app/libs

      - name: Decode signing keystore
        env:
          RUYI_KEYSTORE_B64: ${{ secrets.RUYI_KEYSTORE_B64 }}
        run: |
          echo "$RUYI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ruyi-release.keystore"
          # 运行时给分身签名用的同一把钥，构建时注入 assets（已 gitignore，不入库）
          mkdir -p app/src/main/assets
          cp "$RUNNER_TEMP/ruyi-release.keystore" app/src/main/assets/ruyi-release.keystore

      - name: Build release APK
        env:
          RUYI_KS_FILE: ${{ runner.temp }}/ruyi-release.keystore
          RUYI_KS_PASS: ${{ secrets.RUYI_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ruyi-${{ github.ref_name == 'main' && '0.1.0' || github.ref_name }}.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruyi-apk
          path: dist/*.apk

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
